name: DexterVN
options:
  bundleIdPrefix: com.dextervn
  deploymentTarget:
    iOS: "16.0"
targets:
  DexterVN:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.md"
          - "*.yml"
          - "Podfile"
          - "Podfile.lock"
          - "Pods"
    resources:
      - path: GoogleService-Info.plist
    settings:
      base:
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dextervn.app
        HEADER_SEARCH_PATHS: "$(SRCROOT)/**"
