name: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project DexterVN.xcodeproj -scheme DexterVN -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/DexterVN.app Payload/
          zip -r DexterVN.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DexterVN-ipa
          path: DexterVN.ipa
